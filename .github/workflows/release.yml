name: StallionX Release

# Deliberate opt-in only: upstream v* tags never publish or dispatch elsewhere.
# Create stallionx-vX.Y.Z on main first, then run this workflow from main.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'StallionX version X.Y.Z (existing stallionx-vX.Y.Z tag)'
        required: true
        type: string
      sign_macos:
        description: 'Sign and notarize macOS (requires Apple secrets)'
        default: false
        type: boolean
      installation_preview:
        description: 'Explicit test waiver: skip acceptance suites and publish a non-Latest prerelease for installation testing'
        default: false
        type: boolean
      create_draft:
        description: 'Create a draft Release in THIS repository; false uploads Actions artifacts only'
        default: true
        type: boolean

permissions:
  contents: read
concurrency:
  group: stallionx-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  source:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.source.outputs.tag }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate immutable release source
        id: source
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          tag="stallionx-v$VERSION"
          sha=$(git rev-parse --verify "refs/tags/$tag^{commit}")
          git merge-base --is-ancestor "$sha" origin/main
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  verify:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check packaging and full Go suite at release SHA
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l $(git ls-files '*.go'))"
          python3 -I build/release-assets.py --test
          bash -n build/release-macos.sh build/release-windows.sh
      # A preview is an explicit owner waiver, never an implicit fallback on red.
      # Packaging syntax/integrity and signing remain required in both modes.
      - name: Acceptance Go suite
        if: ${{ !inputs.installation_preview }}
        shell: bash
        run: |
          set -euo pipefail
          go vet -tags nogui ./...
          go test -tags nogui -timeout 45m ./... 2>&1 | tee go-release-tests.log
          go test -race -tags nogui -timeout 45m ./internal/stallionx
      - name: Install pinned browser test runtime
        if: ${{ !inputs.installation_preview }}
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/stx-browsers" --no-audit --no-fund playwright@1.58.2
          "$RUNNER_TEMP/stx-browsers/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Full GUI suite in both engines
        if: ${{ !inputs.installation_preview }}
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/stx-browsers/node_modules
        run: |
          set -o pipefail
          node --test --test-concurrency=2 internal/gui/tests/*.test.cjs 2>&1 | tee gui-release-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stallionx-verification-${{ needs.source.outputs.version }}
          path: '*-release-tests.log'
          retention-days: 14

  macos:
    needs: [source, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: amd64
    runs-on: ${{ matrix.runner }}
    environment: stallionx-release
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Native account tests
        if: ${{ !inputs.installation_preview }}
        run: go test -race -timeout 10m ./internal/stallionx
      - name: Package Mac app
        env:
          VERSION: ${{ needs.source.outputs.version }}
          EXPECTED_ARCH: ${{ matrix.arch }}
          SIGN_MACOS: ${{ inputs.sign_macos }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          test "$(go env GOARCH)" = "$EXPECTED_ARCH"
          bash build/release-macos.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: stallionx-package-macos-${{ matrix.arch }}
          path: |
            dist/StallionX-*.zip
            dist/StallionX-*.dmg
          if-no-files-found: error

  windows:
    needs: [source, verify]
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Do not depend on incidental Python/make versions in the runner image.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install GNU make
        shell: powershell
        run: choco install make --yes --no-progress
      - name: Native Windows checks
        if: ${{ !inputs.installation_preview }}
        shell: bash
        run: |
          go test -run '^$' ./...
          go test -timeout 10m ./internal/stallionx
      - name: Package Windows portable apps
        shell: bash
        env:
          VERSION: ${{ needs.source.outputs.version }}
        run: bash build/release-windows.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: stallionx-package-windows
          path: dist/StallionX-*-windows-*-unsigned.zip
          if-no-files-found: error

  draft:
    needs: [source, macos, windows]
    runs-on: ubuntu-24.04
    environment: stallionx-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: stallionx-package-*
          path: release-assets
          merge-multiple: true
      - name: Verify complete assets and generate hashes
        env:
          VERSION: ${{ needs.source.outputs.version }}
          SIGN_MACOS: ${{ inputs.sign_macos }}
        run: python3 -I build/release-assets.py release-assets "$VERSION" "$SIGN_MACOS"
      - uses: actions/upload-artifact@v4
        with:
          name: stallionx-complete-${{ needs.source.outputs.version }}
          path: release-assets/*
          if-no-files-found: error
      - name: Create draft or explicitly requested installation prerelease
        if: inputs.create_draft || inputs.installation_preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.source.outputs.tag }}
          VERSION: ${{ needs.source.outputs.version }}
          SHA: ${{ needs.source.outputs.sha }}
          INSTALLATION_PREVIEW: ${{ inputs.installation_preview }}
        shell: bash
        run: |
          set -euo pipefail
          # Resolve the remote tag with authenticated GitHub API access, including
          # private repositories: checkout intentionally leaves no Git credentials.
          test "$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)" = "$SHA"
          printf 'StallionX %s\n\nSource: %s\n\n' "$VERSION" "$SHA" > notes.md
          printf '安装前请选择对应系统和架构。unsigned 文件未签名，仅供内测。\nWindows 需要 Microsoft Edge WebView2 Runtime。\n\n' >> notes.md
          printf 'Choose your OS and architecture. Files marked unsigned are unsigned test builds. Windows requires Microsoft Edge WebView2 Runtime.\n\n' >> notes.md
          printf 'Mac 签名状态见文件名；正式公开前需完成真机验证和版本说明。自动更新尚未接入，请手动下载更新。\nMIT and third-party notices are included. Verify downloads against SHA256SUMS.\n' >> notes.md
          flags=(--draft)
          if [[ "$INSTALLATION_PREVIEW" == true ]]; then
            flags=(--prerelease)
            printf '\n安装测试预发布：用户明确豁免验收测试。已有 Go/GUI 失败记录未全部解决；本次跳过验收测试，不是稳定版。请仅用于安装验证，不用于关键工作。\nInstallation preview: acceptance tests explicitly waived; known failures remain. Not a stable release.\n' >> notes.md
          fi
          gh release create "$TAG" release-assets/* --verify-tag "${flags[@]}" --latest=false \
            --title "StallionX $VERSION" --notes-file notes.md
